name: AWS Serverless Audit Lab CI

on:
  push:
    paths:
      - 'aws-serverless-audit-lab/**'
      - '.github/workflows/aws-serverless-audit-lab.yml'
  pull_request:
    paths:
      - 'aws-serverless-audit-lab/**'
      - '.github/workflows/aws-serverless-audit-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-serverless-audit-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aws-serverless-audit-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aws-serverless-audit-lab/requirements-dev.txt

      - name: Install deterministic toolchain
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint Python
        run: ruff check audit src tests

      - name: Run tests and coverage gate
        run: pytest --cov=audit --cov=src --cov-report=term-missing --cov-report=xml

      - name: Lint SAM and CloudFormation
        run: cfn-lint template.yaml

      - uses: aws-actions/setup-sam@v2

      - name: Validate SAM transform
        run: sam validate --lint --template-file template.yaml

      - name: Build Lambda artifacts
        run: sam build --cached --template-file template.yaml

      - name: Audit the reference architecture
        run: python -m audit.audit_template template.yaml --format markdown

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: aws-serverless-audit-lab-coverage
          path: aws-serverless-audit-lab/coverage.xml
          retention-days: 14
